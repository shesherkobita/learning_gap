<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Assessments · Learning Gap</title>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/app.css">
</head>

<body class="dashboard-page" data-role="student">
    <div class="app-shell">
        <aside class="sidebar"><a class="brand" href="/student/dashboard"><span
                    class="brand-mark">L</span><span>learning<span class="brand-accent">gap</span></span></a>
            <div class="side-label">LEARNING SPACE</div><a class="nav-item"
                href="/student/dashboard"><span>⌂</span>Overview</a><a class="nav-item"
                href="/student/courses"><span>▤</span>My courses</a><a class="nav-item"
                href="/student/assessments"><span>▣</span>Assessments</a><a class="nav-item"
                href="/student/learning-gaps"><span>◉</span>Learning gaps</a><a class="nav-item"
                href="/student/learning-plan"><span>✳</span>Learning plan</a><a class="nav-item"
                href="/student/quizzes"><span>✎</span>Quizzes</a>
            <div class="side-bottom">
                <div class="profile-button"><span class="avatar" id="avatar">S</span><span class="profile-text"><b
                            id="side-name">Student</b><small>Learner</small></span></div><button class="logout-link"
                    data-logout>↪ &nbsp; Sign out</button>
            </div>
        </aside>
        <main class="main-area">
            <header class="topbar">
                <div class="breadcrumb">Learning space <span>/</span> Assessments</div>
                <div class="top-actions">
                    <div class="mini-avatar" id="top-avatar">S</div>
                </div>
            </header>
            <section class="content">
                <div class="welcome-row">
                    <div><span class="eyebrow">CLASS WORK</span>
                        <h1>Assessments</h1>
                        <p>Complete published quizzes and assignments from your classes.</p>
                    </div>
                </div>
                <div id="student-assessment-list" class="teacher-class-grid">
                    <div class="loading-line">Loading assessments…</div>
                </div>
            </section>
        </main>
    </div>
    <dialog id="student-assessment-dialog" class="course-dialog wide-dialog">
        <form id="student-assessment-form">
            <div class="dialog-heading">
                <div><span class="eyebrow">ASSESSMENT</span>
                    <h2 id="student-assessment-title"></h2>
                    <p id="student-assessment-description"></p>
                </div><button type="button" class="dialog-close" data-close="student-assessment-dialog">×</button>
            </div>
            <div id="student-assessment-questions"></div>
            <div class="form-message" id="student-assessment-message" role="alert"></div><button
                class="button primary full">Submit work</button>
        </form>
    </dialog>
    <div class="toast" id="toast"></div>
    <script src="/assets/js/teacher-portal.js"></script>
</body>

</html>
